name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the newest run per branch matters. Without this, several pushes in a row
# leave a queue of runs all racing to deploy, and the last one to finish wins —
# which is not necessarily the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      # Never a real database. auth.test.js imports db/prisma.js for real
      # (it isn't mocked there), and that module throws at import time if
      # DATABASE_URL is unset — the mocked test files don't need this at all.
      DATABASE_URL: postgresql://user:pass@localhost:5432/gather_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Deploy the frontend to Vercel.
  #
  # Vercel gates its GitHub integration behind Pro for private organisation
  # repos, so the repo is NOT connected to Vercel. Without this job someone has
  # to remember to run `vercel --prod` by hand after every merge, and the
  # deployed site silently drifts behind main — which is exactly what happened.
  #
  # The Vercel CLI authenticates with a token instead, which works on the free
  # plan. VERCEL_TOKEN (a repository secret) is the only secret; the org and
  # project ids below are not sensitive.
  #
  # The project lives on the maintainer's own Vercel account. The previous one
  # belonged to a former teammate, and when that token stopped working every
  # deploy hung at an auth prompt until the timeout cancelled it — three merges
  # in a row never reached the live site.
  # ---------------------------------------------------------------------------
  deploy-frontend:
    runs-on: ubuntu-latest
    # Only after both suites pass, and only for main — a red PR must never ship,
    # and pull requests should build without deploying.
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # A deploy takes about a minute. Anything past ten means it is stuck, and a
    # job that hangs is worse than one that fails: it reports "in progress"
    # forever, so nobody notices the site has stopped updating. Four runs sat
    # wedged like that before we caught it.
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/frontend

    env:
      VERCEL_ORG_ID: team_jzowmA21EiEEZubgKf8KgalQ
      VERCEL_PROJECT_ID: prj_ufabtV2J4wyWlLWmaXaPP1eT0ZkG
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      # Fail in one second with a clear message rather than letting the CLI
      # wait ten minutes at a login prompt when the secret is missing.
      - name: Check the Vercel token is configured
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned rather than @latest: a CLI major bump shouldn't be able to break
      # deploys on a morning when nobody touched the app.
      - name: Install Vercel CLI
        run: npm install --global vercel@58.10.0

      - name: Pull Vercel environment settings
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # The API base URL is NOT a secret. Vite inlines it into the bundle, so it
      # is readable by anyone who opens devtools and it appears in the URL of
      # every request the app makes. Keeping it in a dashboard field bought no
      # security and cost a day: the value there was wrong, pointed the frontend
      # at its own origin, and every POST came back 405 while every GET returned
      # the SPA's index.html instead of JSON.
      #
      # So it lives here, in version control, where it is reviewable and the
      # build is reproducible. This overwrites whatever `vercel pull` fetched.
      - name: Pin the API base URL
        env:
          API_BASE_URL: https://gather-api-07it.onrender.com/api
        run: |
          mkdir -p .vercel
          touch .vercel/.env.production.local
          grep -v '^VITE_API_BASE_URL=' .vercel/.env.production.local > .vercel/.env.next || true
          mv .vercel/.env.next .vercel/.env.production.local
          echo "VITE_API_BASE_URL=$API_BASE_URL" >> .vercel/.env.production.local
          echo "--- .vercel/.env.production.local ---"
          cat .vercel/.env.production.local

      # Builds here rather than on Vercel's servers, so VITE_API_BASE_URL comes
      # from the file above and the output is inspectable in the log.
      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN

      # Cheap insurance against a silent regression: if the compiled bundle does
      # not contain the API host, the frontend is pointed somewhere else again
      # and the deploy should fail loudly rather than ship a broken site.
      - name: Verify the API URL made it into the bundle
        run: |
          if grep -rq "gather-api-07it.onrender.com" .vercel/output/static/assets/*.js; then
            echo "OK: bundle points at the Render API."
          else
            echo "FAIL: built bundle does not reference the API host." >&2
            exit 1
          fi

      # --yes is load-bearing, not decoration. Without it the CLI asks "Set up
      # and deploy?" whenever it isn't certain the directory is linked, and a
      # prompt on a runner with no stdin waits forever — the job reports "in
      # progress" indefinitely instead of failing. Every step before this one
      # passed; the deploy simply sat at the question.
      - name: Deploy
        run: vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN
