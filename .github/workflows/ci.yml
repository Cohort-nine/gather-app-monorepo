name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the newest run per branch matters. Without this, several pushes in a row
# leave a queue of runs all racing to deploy, and the last one to finish wins —
# which is not necessarily the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      # Never a real database. auth.test.js imports db/prisma.js for real
      # (it isn't mocked there), and that module throws at import time if
      # DATABASE_URL is unset — the mocked test files don't need this at all.
      DATABASE_URL: postgresql://user:pass@localhost:5432/gather_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # Deploys are not done here. Render (backend) and Vercel (frontend) are both
  # connected to this repository and deploy main on every push, so CI's job is
  # to catch a broken test or build before anyone relies on it.
