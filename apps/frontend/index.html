<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gather — Small gatherings, Big connections</title>
    <meta name="description" content="Host a gathering, RSVP to one, and build a track record of actually showing up. Waitlists, attendance tracking, reliability scores, and host ratings." />
    <link rel="canonical" href="https://gather-app-juan.vercel.app/" />

    <!-- Link previews (LinkedIn Featured, Slack, iMessage, X). LinkedIn reads
         only Open Graph tags and needs an ABSOLUTE og:image URL; 1200x627 is
         its recommended size. After changing any of these, re-scrape at
         https://www.linkedin.com/post-inspector/ — LinkedIn caches previews. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gather" />
    <meta property="og:url" content="https://gather-app-juan.vercel.app/" />
    <meta property="og:title" content="Gather — Small gatherings, Big connections" />
    <meta property="og:description" content="Host a gathering, RSVP to one, and build a track record of actually showing up. Waitlists, attendance tracking, reliability scores, and host ratings." />
    <meta property="og:image" content="https://gather-app-juan.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="Gather — Small gatherings, big connections." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gather — Small gatherings, Big connections" />
    <meta name="twitter:description" content="Host a gathering, RSVP to one, and build a track record of actually showing up." />
    <meta name="twitter:image" content="https://gather-app-juan.vercel.app/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/gather-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Poppins for the hero/wordmark (matches the intro exactly); Manrope for
         body/UI — same geometric-rounded family feel, but built for reading
         at small sizes instead of a big display moment. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
